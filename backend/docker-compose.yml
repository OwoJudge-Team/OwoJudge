services:
  gitea:
    image: docker.gitea.com/gitea:1.25.2
    container_name: gitea
    environment:
      - USER_UID=1000
      - USER_GID=1000
      - GITEA__database__DB_TYPE=postgres
      - GITEA__database__HOST=db:${GITEA_DB_PORT}
      - GITEA__database__NAME=${GITEA_DB_NAME}
      - GITEA__database__USER=${GITEA_DB_USER}
      - GITEA__database__PASSWD=${GITEA_DB_PASSWD}
      - GITEA_ADMIN_USER=${GITEA_ADMIN_USER}
      - GITEA_ADMIN_PASSWD=${GITEA_ADMIN_PASSWD}
      - GITEA_ADMIN_EMAIL=${GITEA_ADMIN_EMAIL}
      - GITEA__security__INSTALL_LOCK=true
      - GITEA__server__ROOT_URL=http://gitea:3000/
      - GITEA__WEBHOOK__ALLOWED_HOST_LIST=backend,localhost,127.0.0.1,::1
      - GITEA_HTTP_PORT=${GITEA_HTTP_PORT:-3000}
      - BACKEND_PORT=${BACKEND_PORT:-8787}
      - WEBHOOK_BRANCH_FILTER=${WEBHOOK_BRANCH_FILTER:-main}
    restart: always
    networks:
      - judge-network
    volumes:
      - gitea_data:/data
      - /etc/timezone:/etc/timezone:ro
      - /etc/localtime:/etc/localtime:ro
      - ./secrets:/secrets
      - ./scripts/entrypoint.sh:/scripts/entrypoint.sh:ro
    ports:
      - "127.0.0.1:${GITEA_HTTP_PORT:-3000}:3000"
      - "0.0.0.0:${GITEA_SSH_PORT:-22}:22"
    depends_on:
      - db
    entrypoint: ["/bin/bash", "/scripts/entrypoint.sh"]

  db:
    image: docker.io/library/postgres:14
    restart: always
    environment:
      - POSTGRES_USER=${GITEA_DB_USER}
      - POSTGRES_PASSWORD=${GITEA_DB_PASSWD}
      - POSTGRES_DB=${GITEA_DB_NAME}
    networks:
      - judge-network
    volumes:
      - postgres_db:/var/lib/postgresql/data
  mongodb:
    image: mongo:7.0
    container_name: judge-mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_DATABASE: judge
    ports:
      - "127.0.0.1:${MONGODB_PORT:-27017}:27017"
    volumes:
      - mongodb_data:/data/db
    networks:
      - judge-network

  backend:
    build: 
      context: .
      dockerfile: Dockerfile
    privileged: true
    pid: host
    cgroup: host
    container_name: judge-backend
    restart: unless-stopped
    stop_grace_period: 30s
    depends_on:
      - mongodb
    ports:
      - "${BACKEND_PORT:-8787}:8787"
    environment:
      - NODE_ENV=production
      - MONGODB_URI=mongodb://mongodb:27017/judge
      - ROOT_USERNAME=${ROOT_USERNAME:-admin}
      - GITEA_BASE_URL=http://gitea:3000
      - ADMIN_PASSWD=${ADMIN_PASSWD}
      - DISCORD_WEBHOOK_URL=${DISCORD_WEBHOOK_URL:-}
    volumes:
      - ./uploads:/app/uploads
      - ./problems:/app/problems
      - ./scripts:/app/scripts
      - ./secrets:/secrets:ro
      # Mount cgroup filesystem for isolate
      # - /sys/fs/cgroup:/sys/fs/cgroup:rw
      - /sys/fs/cgroup/:/sys/fs/cgroup/:rw
      # Mount /run for isolate runtime directories
      - /run:/run:rwz
    networks:
      - judge-network
    # Necessary for isolate to work with cgroups
    cap_add:
      - SYS_ADMIN
      - SYS_CHROOT
      - SETUID
      - SETGID
    security_opt:
      - apparmor:unconfined
    # Additional options for better cgroup support
    # cgroup: host


volumes:
  mongodb_data:
  postgres_db:
  gitea_data:

networks:
  judge-network:
    driver: bridge
