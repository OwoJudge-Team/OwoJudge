services:
  nginx:
    image: nginx:1.25-alpine
    container_name: owojudge-nginx
    restart: unless-stopped
    depends_on:
      - frontend
      - backend
      - gitea
    ports:
      - "0.0.0.0:${HTTP_PORT:-80}:80"
      - "0.0.0.0:443:443"
    networks:
      - judge-network
    volumes:
      - ./deploy/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - /var/www/certbot:/var/www/certbot:ro

  certbot:
    image: certbot/certbot
    container_name: owojudge-certbot
    volumes:
      - /etc/letsencrypt:/etc/letsencrypt
      - /var/www/certbot:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12d & wait $${!}; done;'"

  gitea:
    image: docker.gitea.com/gitea:1.25.2
    container_name: judge-gitea
    restart: unless-stopped
    environment:
      - USER_UID=${GITEA_UID:-1000}
      - USER_GID=${GITEA_GID:-1000}

      - GITEA__database__DB_TYPE=postgres
      - GITEA__database__HOST=db:5432
      - GITEA__database__NAME=${GITEA_DB_NAME:-gitea}
      - GITEA__database__USER=${GITEA_DB_USER:-gitea}
      - GITEA__database__PASSWD=${GITEA_DB_PASSWD:-gitea}

      - GITEA_ADMIN_USER=${GITEA_ADMIN_USER:-admin}
      - GITEA_ADMIN_PASSWD=${GITEA_ADMIN_PASSWD:-admin1234}
      - GITEA_ADMIN_EMAIL=${GITEA_ADMIN_EMAIL:-admin@owojudge.local}

      - GITEA__security__INSTALL_LOCK=true

      - GITEA__server__ROOT_URL=http://${PUBLIC_HOST:-127.0.0.1}/gitea/
      - GITEA__server__DOMAIN=${PUBLIC_HOST:-127.0.0.1}
      - GITEA__server__SSH_DOMAIN=${PUBLIC_HOST:-127.0.0.1}
      - GITEA__server__SSH_PORT=${GITEA_SSH_PORT:-22}
      - GITEA__server__HTTP_PORT=3000

      - GITEA__WEBHOOK__ALLOWED_HOST_LIST=backend,localhost,127.0.0.1,::1
    networks:
      - judge-network
    volumes:
      - /var/lib/owojudge/gitea:/data
      - /etc/timezone:/etc/timezone:ro
      - /etc/localtime:/etc/localtime:ro
      - ./backend/secrets:/secrets
      - ./backend/scripts/entrypoint.sh:/scripts/entrypoint.sh:ro
    ports:
      - "0.0.0.0:${GITEA_SSH_PORT:-22}:22"
    depends_on:
      - db
    entrypoint: ["/bin/bash", "/scripts/entrypoint.sh"]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/ >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 20

  db:
    image: docker.io/library/postgres:14
    container_name: judge-postgres
    restart: unless-stopped
    environment:
      - POSTGRES_USER=${GITEA_DB_USER:-gitea}
      - POSTGRES_PASSWORD=${GITEA_DB_PASSWD:-gitea}
      - POSTGRES_DB=${GITEA_DB_NAME:-gitea}
    networks:
      - judge-network
    volumes:
      - /var/lib/owojudge/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${GITEA_DB_USER:-gitea} -d ${GITEA_DB_NAME:-gitea} -h 127.0.0.1"]
      interval: 10s
      timeout: 3s
      retries: 20

  mongodb:
    image: mongo:7.0
    container_name: judge-mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_DATABASE: judge
    networks:
      - judge-network
    volumes:
      - /var/lib/owojudge/mongodb:/data/db
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --eval 'db.runCommand({ ping: 1 }).ok' localhost:27017/judge | grep 1 >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 20

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: judge-backend
    restart: unless-stopped
    stop_grace_period: 30s
    depends_on:
      - mongodb
      - gitea

    privileged: true
    pid: host
    cgroup: host
    cap_add:
      - SYS_ADMIN
      - SYS_CHROOT
      - SETUID
      - SETGID
    security_opt:
      - apparmor:unconfined

    environment:
      - NODE_ENV=production
      - MONGODB_URI=mongodb://mongodb:27017/judge
      - ROOT_USERNAME=admin
      - ADMIN_PASSWD=aaaaaaaa
      - GITEA_BASE_URL=http://gitea:3000

    expose:
      - "8787"

    volumes:
      - /var/lib/owojudge/uploads:/app/uploads
      - /var/lib/owojudge/problems:/app/problems
      - ./backend/scripts:/app/scripts:rw
      - ./backend/secrets:/secrets:ro

      - /sys/fs/cgroup/:/sys/fs/cgroup/:rw
      - /run:/run:rw

    networks:
      - judge-network
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8787/health >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 30

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: judge-frontend
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      - API_URL_INTERNAL=http://backend:8787
      - NEXT_PUBLIC_API_URL=/api
    networks:
      - judge-network
    expose:
      - "3000"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/ >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 30

networks:
  judge-network:
    driver: bridge

