services:
  nginx:
    image: nginx:1.25-alpine
    container_name: owojudge-nginx
    restart: unless-stopped
    depends_on:
      - frontend
      - backend
      - gitea
    ports:
      - "0.0.0.0:80:80"
      - "0.0.0.0:443:443"
    networks:
      - judge-network
    environment:
      - DOMAIN_NAME=${DOMAIN_NAME}
    volumes:
      - ./deploy/nginx/nginx.conf.template:/etc/nginx/templates/default.conf.template:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - /var/www/certbot:/var/www/certbot:ro

  certbot:
    image: certbot/certbot
    container_name: owojudge-certbot
    volumes:
      - /etc/letsencrypt:/etc/letsencrypt
      - /var/www/certbot:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12d & wait $${!}; done;'"

  gitea:
    image: docker.gitea.com/gitea:1.25.2
    container_name: judge-gitea
    restart: unless-stopped
    environment:
      - USER_UID=${GITEA_UID:-1000}
      - USER_GID=${GITEA_GID:-1000}
      - GITEA__database__DB_TYPE=postgres
      - GITEA__database__HOST=db:5432
      - GITEA__database__NAME=${GITEA_DB_NAME:-gitea}
      - GITEA__database__USER=${GITEA_DB_USER:-gitea}
      - GITEA__database__PASSWD=${GITEA_DB_PASSWD:-gitea}
      - GITEA_ADMIN_USER=${GITEA_ADMIN_USER:-admin}
      - GITEA_ADMIN_PASSWD=${GITEA_ADMIN_PASSWD:-admin1234}
      - GITEA_ADMIN_EMAIL=${GITEA_ADMIN_EMAIL:-admin@owojudge.local}
      - GITEA__security__INSTALL_LOCK=true
      - GITEA__server__ROOT_URL=https://${DOMAIN_NAME}/gitea/
      - GITEA__server__DOMAIN=${DOMAIN_NAME}
      - GITEA__server__PROTOCOL=http
      - GITEA__server__SSH_DOMAIN=${DOMAIN_NAME}
      - GITEA__server__SSH_PORT=${GITEA_SSH_PORT:-22}
      - GITEA__server__HTTP_PORT=3000
      - GITEA__WEBHOOK__ALLOWED_HOST_LIST=backend,localhost,127.0.0.1,::1
    networks:
      - judge-network
    volumes:
      - /var/lib/owojudge/gitea:/data:z
      - /etc/timezone:/etc/timezone:ro
      - /etc/localtime:/etc/localtime:ro
      - ./backend/secrets:/secrets:z
      - ./backend/scripts/entrypoint.sh:/scripts/entrypoint.sh:ro,z
    ports:
      - "0.0.0.0:${GITEA_SSH_PORT:-22}:22"
    depends_on:
      - db
    entrypoint: ["/bin/bash", "/scripts/entrypoint.sh"]

  db:
    image: docker.io/library/postgres:14
    container_name: judge-postgres
    restart: unless-stopped
    environment:
      - POSTGRES_USER=${GITEA_DB_USER:-gitea}
      - POSTGRES_PASSWORD=${GITEA_DB_PASSWD:-gitea}
      - POSTGRES_DB=${GITEA_DB_NAME:-gitea}
    networks:
      - judge-network
    volumes:
      - /var/lib/owojudge/postgres:/var/lib/postgresql/data:z

  mongodb:
    image: mongo:7.0
    container_name: judge-mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_DATABASE: judge
    networks:
      - judge-network
    volumes:
      - /var/lib/owojudge/mongodb:/data/db:z

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: judge-backend
    restart: unless-stopped
    privileged: true
    pid: host
    cgroup: host
    cap_add:
      - SYS_ADMIN
      - SYS_CHROOT
      - SETUID
      - SETGID
    environment:
      - NODE_ENV=production
      - MONGODB_URI=mongodb://mongodb:27017/judge
      - ROOT_USERNAME=admin
      - ADMIN_PASSWD=${ADMIN_PASSWD:-aaaaaaaa}
      - GITEA_BASE_URL=http://gitea:3000
      - SALT=${BACKEND_SALT:-justasalt}
      - COOKIE_SECRET=${COOKIE_SECRET:-cj6u.4t/6}
      - SESSION_SECRET=${SESSION_SECRET:-z/ fup6ql4}
      - AUTO_BACKUP_ENABLED=${AUTO_BACKUP_ENABLED:-true}
      - AUTO_BACKUP_INTERVAL_SECONDS=${AUTO_BACKUP_INTERVAL_SECONDS:-21600}
      - AUTO_BACKUP_OUTPUT_DIR=${AUTO_BACKUP_OUTPUT_DIR:-/app/scripts/backup-temp/periodic}
      - AUTO_BACKUP_INCLUDE_RAW=${AUTO_BACKUP_INCLUDE_RAW:-true}
      - AUTO_BACKUP_RUN_ON_START=${AUTO_BACKUP_RUN_ON_START:-false}
      - AUTO_BACKUP_GDRIVE_ENABLED=${AUTO_BACKUP_GDRIVE_ENABLED:-false}
      - AUTO_BACKUP_GDRIVE_REMOTE=${AUTO_BACKUP_GDRIVE_REMOTE:-gdrive}
      - AUTO_BACKUP_GDRIVE_PATH=${AUTO_BACKUP_GDRIVE_PATH:-owojudge-backups}
      - RCLONE_CONFIG=${RCLONE_CONFIG:-/secrets/rclone.conf}
    expose:
      - "8787"
    volumes:
      - /var/lib/owojudge/uploads:/app/uploads:z
      - /var/lib/owojudge/problems:/app/problems:z
      - ./backend/scripts:/app/scripts:rwz
      - ./backend/secrets:/secrets:roz
      - /sys/fs/cgroup/:/sys/fs/cgroup/:rwz
      - /run:/run:rwz
    networks:
      - judge-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: judge-frontend
    restart: unless-stopped
    environment:
      - API_URL_INTERNAL=http://backend:8787
      - NEXT_PUBLIC_API_URL=/api
    networks:
      - judge-network
    expose:
      - "3000"

networks:
  judge-network:
    driver: bridge